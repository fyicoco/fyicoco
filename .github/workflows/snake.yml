name: snake

# Erzeugt täglich die Contribution-Schlange im Bernstein-Look und legt sie in den Branch "output"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff6b4a&color_dots=#161109,#3d2a14,#7a5c2c,#c0603f,#ff6b4a
            dist/snake-light.svg?color_snake=#d4483a&color_dots=#ebe6dc,#f2cba9,#e9a173,#d9733f,#c0402a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "snake aktualisiert"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
